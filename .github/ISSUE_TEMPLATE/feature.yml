name: 기능 제안
description: 분석 기능, 데이터 파이프라인 단계, 재현성 개선 작업을 제안합니다.
title: "[Feature] "
labels: ["type: feature"]
assignees: ["JunSeobGo"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 작업으로 달성할 분석 또는 개발 목표를 작성하세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현 또는 분석 작업을 체크리스트로 작성하세요.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업 완료를 어떻게 검증할지 작성하세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 데이터셋, 논문, Issue, 설계 문서를 연결하세요.
