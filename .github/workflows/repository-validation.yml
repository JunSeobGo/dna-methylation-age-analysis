name: 저장소 검증

on:
  push:
    branches: [develop, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 저장소 파일 검증
        run: python scripts/ci/validate_repository.py
