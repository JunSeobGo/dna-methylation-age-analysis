name: 저장소 검증

on:
  push:
    branches: [develop, 'feature/**', 'fix/**', 'docs/**', 'ci/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 저장소 파일 검증
        run: python scripts/ci/validate_repository.py

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: R 4.3.3 설정
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: R 스크립트 구문 검사
        run: Rscript scripts/ci/validate_r_syntax.R
